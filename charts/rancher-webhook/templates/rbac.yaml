apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rancher-webhook
rules:
- apiGroups:
  - management.cattle.io
  resources:
  - users
  - settings
  - podsecurityadmissionconfigurationtemplates
  - features
  - clusterroletemplatebindings
  - projectroletemplatebindings
  - globalrolebindings
  - clusterproxyconfigs
  - clusters
  - projects
  - globalroles
  - roletemplates
  - nodes
  - userattributes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - management.cattle.io
  resources:
  - fleetworkspaces
  verbs:
  - "*"
- apiGroups:
  - provisioning.cattle.io
  resources:
  - clusters
  verbs:
  - get
  - list
  - watch
  - patch
- apiGroups:
  - rke.cattle.io
  resources:
  - etcdsnapshots
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - catalog.cattle.io
  resources:
  - clusterrepos
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - clusterrolebindings
  verbs:
  - get
  - list
  - watch
  - create
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  verbs:
  - get
  - list
  - watch
  - create
  # We're assigning fleetworkspace-admin without having fleetworkspace-admin rights..
  - bind
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - delete
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
  - create
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - machinedeployments
  - clusters
  verbs:
  - get
- apiGroups:
  - rke-machine.cattle.io
  resources:
  - "*"
  verbs:
  - list
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiregistration.k8s.io
  resources:
  - apiservices
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rancher-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rancher-webhook
subjects:
- kind: ServiceAccount
  name: rancher-webhook
  namespace: {{.Release.Namespace}}
